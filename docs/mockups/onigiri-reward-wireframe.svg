      .mono { fill: #777777; font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step-title { fill: #111111; font: 600 18px -apple-system, BlinkMacSystemFont, sans-serif; }
      .step-meta { fill: #777777; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.2px; }
